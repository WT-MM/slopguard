[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name matches the registered PyPI trusted publisher; the import
# package, console script, and all tokens remain `slopguard`.
name = "slopguards"
dynamic = ["version"]
description = "Static checks for the failure modes of AI-generated code — runs standalone or as a blocking hook inside Claude Code and OpenAI Codex CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wesley Maa", email = "wesley.maa@gmail.com" }]
keywords = [
  "lint", "static-analysis", "code-quality", "ai", "llm",
  "claude-code", "codex", "agent", "hooks",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/WT-MM/slopguard"
Repository = "https://github.com/WT-MM/slopguard"
Issues = "https://github.com/WT-MM/slopguard/issues"

[project.scripts]
slopguard = "slopguard.cli:main"

[tool.setuptools]
packages = ["slopguard"]

[tool.setuptools.dynamic]
version = { attr = "slopguard.__version__" }
