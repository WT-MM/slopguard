name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python tests/run_tests.py
      - name: Self-scan (slopguard must be slop-free)
        run: ./bin/slopguard scan slopguard/ bin/ tests/run_tests.py
      - name: Package install smoke test
        run: |
          python -m venv /tmp/pkgtest
          /tmp/pkgtest/bin/pip install --quiet .
          /tmp/pkgtest/bin/slopguard --version
          /tmp/pkgtest/bin/slopguard scan tests/fixtures/slop_example.py --fail-on never > /dev/null
